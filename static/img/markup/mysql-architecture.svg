<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">MySQL 体系架构拓扑 / MySQL Architecture Topology</title>
  <desc id="desc">展示 MySQL 客户端接入层、服务端核心模块（连接池、解析器、优化器、缓冲池）、存储引擎层（InnoDB 与 MyISAM）与底层物理文件。Visual topology of MySQL layers from client applications to storage engines and disk files.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="756" height="256" rx="14" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Layer 1: Client Applications (Left) -->
  <g transform="translate(24, 28)">
    <rect width="130" height="204" rx="10" fill="url(#cardGrad)" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="130" height="32" rx="10" fill="#e2e8f0"/>
    <rect x="0" y="22" width="130" height="10" fill="#e2e8f0"/>
    <text x="65" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#334155">客户端接入层</text>

    <g transform="translate(12, 48)">
      <rect width="106" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="53" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">MySQL Shell</text>
      <text x="53" y="36" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">CLI 客户端</text>
    </g>
    <g transform="translate(12, 102)">
      <rect width="106" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="53" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">App Pool</text>
      <text x="53" y="36" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">应用连接池</text>
    </g>
    <g transform="translate(12, 156)">
      <rect width="106" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="53" y="22" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#166534">Port 3306</text>
    </g>
  </g>

  <!-- Connectors Layer 1 -> Layer 2 -->
  <path d="M156 130 L188 130" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="188,126 196,130 188,134" fill="#0284c7"/>

  <!-- Layer 2: MySQL Server Core (mysqld) -->
  <g transform="translate(198, 28)">
    <rect width="254" height="204" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="254" height="32" rx="10" fill="url(#primaryGrad)"/>
    <rect x="0" y="22" width="254" height="10" fill="url(#primaryGrad)"/>
    <text x="127" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#ffffff">MySQL 服务端核心 (mysqld)</text>

    <!-- Module Grid -->
    <g transform="translate(14, 46)">
      <rect width="106" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="53" y="21" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#0369a1">连接池管理</text>
      <text x="53" y="34" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Auth &amp; Threads</text>

      <rect x="120" y="0" width="106" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="173" y="21" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#0369a1">SQL 接口与解析</text>
      <text x="173" y="34" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Parser &amp; AST</text>

      <rect x="0" y="52" width="106" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="53" y="73" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#0369a1">查询优化器</text>
      <text x="53" y="86" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Optimizer</text>

      <rect x="120" y="52" width="106" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="173" y="73" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#0369a1">Buffer Pool</text>
      <text x="173" y="86" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">缓冲池与缓存</text>

      <!-- Bottom banner -->
      <rect x="0" y="104" width="226" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="113" y="122" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#334155">my.cnf / 服务配置与状态</text>
      <text x="113" y="136" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">max_connections · innodb_buffer_pool_size</text>
    </g>
  </g>

  <!-- Connectors Layer 2 -> Layer 3 -->
  <path d="M454 130 L486 130" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="486,126 494,130 486,134" fill="#0284c7"/>

  <!-- Layer 3: Storage Engines (Right) -->
  <g transform="translate(496, 28)">
    <rect width="238" height="204" rx="10" fill="url(#cardGrad)" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="238" height="32" rx="10" fill="#e2e8f0"/>
    <rect x="0" y="22" width="238" height="10" fill="#e2e8f0"/>
    <text x="119" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#334155">存储引擎与物理存储层</text>

    <!-- InnoDB Engine Card -->
    <g transform="translate(14, 46)">
      <rect width="210" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
      <text x="16" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#1e40af">InnoDB (默认引擎)</text>
      <rect x="145" y="10" width="55" height="18" rx="4" fill="#dbeafe"/>
      <text x="172" y="23" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#1e40af">ACID 事务</text>
      <text x="16" y="42" font-family="sans-serif" font-size="9" fill="#475569">行级锁定 · 外键约束 · 崩溃安全恢复</text>
      <text x="16" y="56" font-family="monospace" font-size="8.5" fill="#64748b">ibdata1 / 表空间 .ibd / Redo Log</text>
    </g>

    <!-- MyISAM & File system -->
    <g transform="translate(14, 122)">
      <rect width="210" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#334155">MyISAM (历史归档)</text>
      <rect x="145" y="10" width="55" height="18" rx="4" fill="#f1f5f9"/>
      <text x="172" y="23" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">表级锁定</text>
      <text x="16" y="42" font-family="sans-serif" font-size="9" fill="#475569">适合只读报表分析与简单全文检索</text>
      <text x="16" y="57" font-family="sans-serif" font-size="8.5" fill="#64748b">物理文件：.MYD (数据) / .MYI (索引)</text>
    </g>
  </g>
</svg>
